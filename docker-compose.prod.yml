services:
  redis:
    image: redis:7-alpine
    container_name: yaa-redis
    restart: unless-stopped
    volumes:
      - yaa_redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: yaa:latest
    container_name: yaa-api
    restart: unless-stopped
    env_file:
      - .env.oracle
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "8001:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

  worker:
    image: yaa:latest
    container_name: yaa-worker
    restart: unless-stopped
    command: ["/app/worker-entrypoint.sh"]
    env_file:
      - .env.oracle
    environment:
      - REDIS_URL=redis://redis:6379
    healthcheck:
      disable: true
    depends_on:
      - redis
      - api

volumes:
  yaa_redis_data:
