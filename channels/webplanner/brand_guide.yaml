brand:
  name: "웹플래너 - 5분 기획서"
  tagline: "홈페이지, 고민만 하지 마세요. 5분이면 기획서 완성."
  positioning: "소상공인/전문직을 위한 AI 기반 웹사이트 기획 자동화 플랫폼"
  values:
    - "복잡한 걸 쉽게"
    - "전문가 수준의 기획서를 누구나"
    - "시간과 비용 절약"
    - "에이전시와의 소통 간극 해소"

target_audience:
  primary: "홈페이지가 필요한 소상공인, 전문직, 예비 창업자 (25~50세)"
  pain_points:
    - "기획서가 뭔지 모르겠다"
    - "에이전시에 뭘 전달해야 할지 막막하다"
    - "제작 비용이 적정한지 판단할 수 없다"
    - "규제(의료광고법 등) 준수하면서 잘 만들고 싶다"
    - "예산이 적어 직접 해보고 싶지만 방법을 모른다"
  content_needs:
    - "홈페이지 기획서 작성법"
    - "업종별 홈페이지 구조/사례"
    - "제작 비용 가이드"
    - "사이트맵/브랜딩 기초 지식"
    - "에이전시 소통 팁"

tone_and_manner:
  personality: "편안한 동생이 설명해주는 느낌 - 잘 아는 친구가 카페에서 알려주듯이"
  formality: "casual"
  emotion: "encouraging"
  humor_level: "light"
  writing_style:
    sentence_length: "short-to-medium"
    vocabulary: "전문용어는 반드시 쉬운 말로 풀어서, 비유 적극 활용"
    call_to_action: "가볍고 자연스러운 권유 (강요 느낌 X)"
  do:
    - "시청자의 막막함에 공감하며 시작"
    - "구체적 수치와 사례로 신뢰 형성"
    - "한 영상에 한 가지 핵심 메시지만"
    - "실제 화면/목업으로 시각적 이해 돕기"
    - "'이것만 알면 됩니다' 식 명쾌한 정리"
  dont:
    - "기술 용어 남발 (UX, IA, 와이어프레임 등 설명 없이 사용)"
    - "경쟁 서비스 비하"
    - "과도한 판매 압박 ('지금 당장 가입하세요!')"
    - "불필요하게 긴 서론"

voice_design:
  narration_style: "또래 친구가 설명하듯 편안하지만 핵심은 정확한 남성 목소리"
  elevenlabs_voice_id: ""
  speech_rate: "moderate-to-fast"
  pitch: "medium"
  language: "ko"
  reference_samples: []

visual_identity:
  color_palette:
    - "#18181B"  # Zinc 900 (메인 텍스트/배경)
    - "#3B82F6"  # Blue 500 (CTA/강조)
    - "#F4F4F5"  # Zinc 100 (밝은 배경)
    - "#FAFAFA"  # Zinc 50 (카드 배경)
  thumbnail_style: "미니멀 배경 + 큰 한글 텍스트(Pretendard Bold) + 화면 목업 (사람 얼굴 X)"
  font_preference: "Pretendard Bold(썸네일 제목), Pretendard Regular(자막/본문)"

competitors:
  - channel: "워드프레스 코리아"
    strengths:
      - "DIY 홈페이지 제작 튜토리얼"
    differentiation: "직접 만드는 게 아닌 '기획서 작성' 특화 - 에이전시 전달용"
  - channel: "마케팅자동화연구소"
    strengths:
      - "마케팅/퍼널 전략 콘텐츠"
    differentiation: "실무 기획서 작성에 집중, 이론보다 실행"

content_pillars:
  - name: "기획 101"
    purpose: "검색 유입 + 채널 권위"
    format: "롱폼 7~12분"
    ai_automation: "80%"
  - name: "업종별 가이드"
    purpose: "업종 타겟 롱테일 SEO"
    format: "롱폼 8~15분"
    ai_automation: "50%"
  - name: "웹플래너 활용법"
    purpose: "제품 전환"
    format: "롱폼 5~10분"
    ai_automation: "30%"
  - name: "브랜딩 인사이트"
    purpose: "채널 폭 확대"
    format: "롱폼 7~12분"
    ai_automation: "80%"
  - name: "숏폼 팁"
    purpose: "알고리즘 노출 + 구독"
    format: "Shorts 30~60초"
    ai_automation: "100%"

personas:
  - name: "김사장"
    age: "35~50세"
    type: "음식점, 카페, 미용실 사장님"
    core_pain: "기획서가 뭔지 모르겠다"
  - name: "이원장"
    age: "30~45세"
    type: "피부과, 치과, 변호사"
    core_pain: "규제 준수하면서 잘 만들고 싶다"
  - name: "박대표"
    age: "25~40세"
    type: "예비 창업자, 프리랜서"
    core_pain: "예산 적은데 홈페이지까지 신경 쓸 여유 없다"
