services:
  agents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-ai-agents
    ports:
      - "8000:8000"
    volumes:
      - ./packages/core/yaa_core:/app/packages/core/yaa_core:ro
      - ./packages/agents/yaa_agents:/app/packages/agents/yaa_agents:ro
      - ./packages/api/yaa_app:/app/packages/api/yaa_app:ro
      - ./channels:/app/channels
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://agency:${DB_PASSWORD}@db:5432/youtube_agency
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-ai-worker
    command: ["python", "-m", "arq", "yaa_app.worker.tasks.WorkerConfig"]
    volumes:
      - ./packages/core/yaa_core:/app/packages/core/yaa_core:ro
      - ./packages/agents/yaa_agents:/app/packages/agents/yaa_agents:ro
      - ./packages/api/yaa_app:/app/packages/api/yaa_app:ro
      - ./channels:/app/channels
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://agency:${DB_PASSWORD}@db:5432/youtube_agency
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: youtube-ai-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: youtube-ai-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: youtube_agency
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d youtube_agency"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
