[package]
name = "yaa-desktop"
version = "0.1.0"
description = "YouTube AI Agent Agency Desktop App"
authors = []
license = "MIT"
repository = "https://github.com/VetEngineer/Youtube-AI-Agent-Agency"
default-run = "yaa-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yaa_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 추후 추가 예정:
# tauri-plugin-shell = "2"    (M2: OAuth URL open, scope 제한 필수)
# tauri-plugin-fs = "2"       (M4: 네이티브 파일 다이얼로그)
# tauri-plugin-updater = "2"  (M5: 자동 업데이트)

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
