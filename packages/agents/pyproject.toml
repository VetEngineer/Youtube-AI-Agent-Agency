[project]
name = "yaa-agents"
version = "0.1.0"
description = "YAA Agents - LangGraph 기반 AI 에이전트 파이프라인"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "yaa-core",
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph-supervisor>=0.0.31",
]

[project.optional-dependencies]
media = [
    "elevenlabs>=1.0.0",
    "moviepy>=2.0.0",
    "openai-whisper>=20240930",
]
publisher = [
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
]
search = [
    "tavily-python>=0.5.0",
    "beautifulsoup4>=4.12.0",
]
rag = [
    "chromadb>=0.5",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yaa_agents"]

[tool.uv.sources]
yaa-core = { workspace = true }
