[project]
name = "yaa-core"
version = "0.1.0"
description = "YAA Core - 공유 모듈 및 데이터베이스"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "langchain>=0.3.0",
    "structlog>=24.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
db-prod = [
    "asyncpg>=0.30.0",
]
monitoring = [
    "prometheus-client>=0.21",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yaa_core"]
