[project]
name = "youtube-ai-agent-agency-monorepo"
version = "0.1.0"
description = "Monorepo root for Youtube AI Agent Agency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/core", "packages/agents", "packages/api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["N802"]
"**/alembic/**/*.py" = ["E501", "W291"]
